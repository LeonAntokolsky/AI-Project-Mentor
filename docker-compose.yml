services:
  mentor-agent:
    build: .
    container_name: ai_project_mentor
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ${TARGET_PROJECT_PATH:-.}:/workspace/project
      # Mount local src directory for instant code updates
      - ./src:/app/src
      # Persist SQLite database on host machine
      - ./data:/app/data
      - ~/.ssh:/root/.ssh:ro
